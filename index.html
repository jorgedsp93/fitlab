<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitLab · Your daily practice</title>
  <meta name="description" content="A calmer place to train. Your 12-week program, workout log, and progress, together in FitLab.">
  <meta name="theme-color" content="#f5f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitLab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
  <link rel="icon" type="image/png" href="favicon-32-v3.png">
  <link rel="stylesheet" href="styles.css?v=13.0.2">
  <script src="companion.js?v=13.0.2" defer></script>
  <script src="app.js?v=13.0.2" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <div id="storageWarning" role="alert" hidden></div>
  <main id="app" tabindex="-1"></main>
  <div id="restbar" role="region" aria-label="Rest timer">
    <span class="timer-icon" aria-hidden="true">◷</span>
    <div class="rt" id="rtnum">0:00</div>
    <div class="rl" id="rtlabel">Rest</div>
    <button id="rtadd" aria-label="Add 30 seconds to rest">+30s</button>
    <button id="rtskip">Skip</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet-bg" data-close="1"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></section>
  </div>
  <nav aria-label="Main navigation"><div class="inner" id="nav"></div></nav>
  <input type="file" id="restoreFile" accept="application/json,.json" hidden>
  <noscript><p class="card">FitLab needs JavaScript to save and display your workouts. Please enable it in your browser.</p></noscript>
</body>
</html>
