<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>FitLab — 12-Week Recomp</title>
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FitLab" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v3.png" />
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-v3.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v3.png" />
<style>
:root{
  --bg:#0b0d12; --surface:#14171f; --surface2:#1b1f2a; --surface3:#232838;
  --text:#f4f7fb; --muted:#8b94a7; --faint:#5b6477;
  --line:#262c3a;
  --accent:#34d399; --accent2:#22d3ee; --accent-ink:#062018;
  --warn:#fbbf24; --hot:#fb7185;
  --map-base:#2a3140; --map-2:rgba(52,211,153,.40);
  --radius:18px; --radius-sm:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overscroll-behavior-y:none;}
body{font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
a{color:var(--accent);}
::selection{background:var(--accent);color:var(--accent-ink);}

/* layout */
#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-top) + 8px) 16px calc(var(--nav-h) + var(--safe-bot) + 24px);min-height:100vh;}
.view{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.app-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;}
.app-head .hello{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.app-head h1{font-size:26px;margin:2px 0 0;font-weight:800;letter-spacing:-.5px;}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--line);}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card.tight{padding:14px;}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px;}
.muted{color:var(--muted);} .faint{color:var(--faint);} .small{font-size:13px;} .tiny{font-size:11.5px;}
.center{text-align:center;}
.brandtitle{display:flex;align-items:center;gap:11px;}
.brandmark{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.28);}
.brandbar{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;}
.brandbar img{width:24px;height:24px;border-radius:7px;object-fit:cover;}

/* hero / phase banner */
.hero{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px;margin-bottom:14px;
  background:linear-gradient(135deg,#0e2a23 0%,#0c2230 55%,#101725 100%);border:1px solid var(--line);}
.hero:before{content:"";position:absolute;inset:-40% -10% auto auto;width:60%;height:160%;
  background:radial-gradient(closest-side,rgba(52,211,153,.30),transparent);filter:blur(6px);}
.hero .row{position:relative;display:flex;justify-content:space-between;align-items:flex-end;}
.phase-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--accent);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);padding:4px 9px;border-radius:999px;}
.hero h2{margin:10px 0 2px;font-size:22px;font-weight:800;letter-spacing:-.4px;}
.hero .sub{color:#bcd;font-size:13.5px;}
.weekpill{text-align:right;}
.weekpill .big{font-size:30px;font-weight:800;line-height:1;}
.weekpill .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

/* progress bar */
.bar{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden;margin-top:12px;position:relative;}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease;}

/* focus chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
.chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:#cfe;}
.chip.k{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.30);color:var(--accent);}

/* exercise list rows */
.exrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
.exrow:first-child{border-top:none;}
.exrow .thumb{width:54px;height:54px;border-radius:12px;background:var(--surface3);object-fit:cover;flex:none;}
.exrow .meta{flex:1;min-width:0;}
.exrow .meta b{font-size:15px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exrow .meta .sets{font-size:12.5px;color:var(--muted);margin-top:1px;}
.exrow .go{color:var(--faint);font-size:18px;flex:none;}
.exrow .donedot{width:10px;height:10px;border-radius:50%;background:var(--surface3);flex:none;}
.exrow.complete .donedot{background:var(--accent);box-shadow:0 0 0 4px rgba(52,211,153,.15);}
.miniworkout{display:flex;flex-direction:column;gap:10px;}
.miniworkout .mwrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
.miniworkout .mwrow:first-child{border-top:none;}
.miniworkout .mwtitle{font-size:14px;font-weight:800;}
.miniworkout .mwsub{font-size:12px;color:var(--muted);margin-top:1px;}
.miniworkout .mwcount{font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap;}
.blockdots{display:flex;gap:5px;margin-top:10px;}
.blockdots i{height:5px;flex:1;border-radius:999px;background:var(--surface3);}
.blockdots i.done{background:var(--accent);}
.blockdots i.on{background:var(--accent2);}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;
  font-weight:800;font-size:15.5px;letter-spacing:.2px;background:var(--surface2);border:1px solid var(--line);color:var(--text);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border:none;}
.btn.ghost{background:transparent;}
.btn:active{transform:scale(.985);}
.btn.sm{padding:10px 14px;width:auto;font-size:13.5px;border-radius:11px;}

/* segmented */
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);}
.seg button.on{background:var(--surface3);color:var(--text);}

/* calendar */
.weekblock{margin-bottom:12px;}
.weekblock .wh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.weekblock .wh.cur{border-color:rgba(52,211,153,.45);}
.weekblock .wh .t{font-weight:800;}
.weekblock .wh .p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;}
.day{aspect-ratio:1/1.15;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;position:relative;}
.day .dn{font-size:10px;color:var(--faint);font-weight:700;}
.day .dnum{font-size:9px;color:var(--faint);font-weight:700;opacity:.8;}
.day.today .dnum,.day.today .dn{color:var(--accent2);}
.day.done .dnum{color:var(--accent);}
.day .ic{display:flex;align-items:center;justify-content:center;}
.dayicon{width:32px;height:32px;border-radius:9px;object-fit:cover;display:block;box-shadow:0 5px 12px rgba(0,0,0,.28);}
.day.rest{opacity:.6;}
.day.done{border-color:var(--accent);background:rgba(52,211,153,.08);}
.day.today{outline:2px solid var(--accent2);outline-offset:1px;}
.day .check{position:absolute;top:3px;right:4px;font-size:9px;color:var(--accent);}

/* library grid */
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.libcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.libcard img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface3);display:block;}
.libcard .lc{padding:9px 10px;}
.libcard .lc b{font-size:13px;font-weight:700;display:block;line-height:1.25;}
.libcard .lc span{font-size:11px;color:var(--muted);}
.section-t{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:18px 2px 10px;}

/* set tracker */
.settable{margin-top:10px;}
.set-hd,.set-row{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;align-items:center;}
.set-hd{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:0 2px 6px;text-align:center;}
.set-hd div:first-child{text-align:left;}
.set-row{margin-bottom:8px;}
.set-row .sn{font-size:13px;font-weight:800;color:var(--muted);text-align:center;}
.stepper{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.stepper input{flex:1;min-width:0;background:transparent;border:none;text-align:center;color:var(--text);font-size:16px;font-weight:800;padding:11px 0;}
.stepper input:focus{outline:none;}
.stepper .stp{width:30px;flex:none;font-size:20px;font-weight:800;color:var(--accent);padding:9px 0;line-height:1;}
.stepper .stp:active{background:var(--surface3);}
.set-row.done .stepper{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.07);}
.set-row .ck{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--faint);}
.set-row.done .ck{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.sugg{font-size:12.5px;color:#d7f3e8;background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.22);border-radius:10px;padding:7px 10px;margin:8px 0;line-height:1.35;font-weight:750;}
.weighthint,.alts,.evalitem{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;line-height:1.45;}
.weighthint{color:#d7f3e8;background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.22);font-weight:700;}
.weighthint b,.alts b,.evalitem b{color:var(--text);}
.alts span{color:#d7dce6;}
.swapbox{font-size:12.5px;color:var(--muted);background:rgba(34,211,238,.055);border:1px solid rgba(34,211,238,.22);border-radius:12px;padding:9px 10px;margin:8px 0;line-height:1.35;}
.swaptop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.swaptop b{font-size:12.5px;color:var(--text);}
.swaptop span{font-size:11.5px;text-align:right;}
.swapbuttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
.swapbtn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(34,211,238,.32);background:rgba(34,211,238,.10);color:var(--accent2);border-radius:10px;padding:7px 9px;font-size:12px;font-weight:850;}
.swapbtn.on{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.12);color:var(--accent);}
.swapbtn.swapclear{border-color:var(--line);background:rgba(255,255,255,.035);color:var(--muted);}
.exextras{margin:6px 0 8px;font-size:12.5px;color:var(--muted);}
.exextras summary{display:inline-flex;align-items:center;color:var(--accent2);font-weight:800;list-style:none;cursor:pointer;}
.exextras summary::-webkit-details-marker{display:none;}
.exextras summary:after{content:"+";margin-left:6px;color:var(--faint);font-weight:900;}
.exextras[open] summary:after{content:"-";}
.exextras .exdetails{margin-top:7px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:8px 10px;line-height:1.45;}
.exextras .exdetails div+div{margin-top:5px;}
.exblock .eh .vid{width:40px;height:40px;border-radius:11px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.4);color:#fb7185;display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none;flex:none;}
.exblock .eh .vid:active{transform:scale(.94);}
.exblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;}
.exblock .eh{display:flex;gap:12px;align-items:center;margin-bottom:4px;}
.exblock .eh img{width:50px;height:50px;border-radius:11px;object-fit:cover;background:var(--surface3);}
.exblock .eh .nm{flex:1;}
.exblock .eh .nm b{font-size:16px;font-weight:800;}
.exblock .eh .nm .sub{font-size:12.5px;color:var(--muted);}
.exblock .eh .info{font-size:13px;color:var(--accent);font-weight:700;}
.restbtn{margin-top:4px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent2);font-weight:700;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);padding:6px 11px;border-radius:9px;}
.supersettag{font-size:11px;font-weight:800;color:var(--warn);text-transform:uppercase;letter-spacing:.8px;}
.flowcard{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.flowtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.flowbadge{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--accent2);background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.24);border-radius:999px;padding:4px 9px;white-space:nowrap;}
.flowcard h2{font-size:20px;line-height:1.15;margin:0 0 3px;font-weight:850;}
.flowcard .flowsub{font-size:12.5px;color:var(--muted);}
.flowmoves{display:flex;flex-direction:column;gap:12px;}
.flowmoves .exblock{margin-bottom:0;}
.flowactions{display:flex;gap:8px;margin:12px 0 4px;}
.flowactions .btn{flex:1;}
.flowactions .btn[disabled]{opacity:.32;pointer-events:none;}
.flowhint{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:8px;}
.evalgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.evalitem{margin:0;}
.evalitem .v{font-size:18px;font-weight:850;color:var(--text);}
.evalitem .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:800;}
.reviewrows{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.reviewrow{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:9px 10px;}
.reviewrow .rvtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.reviewrow b{font-size:13px;}
.reviewrow .rvstatus{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;color:var(--warn);}
.reviewrow.ok .rvstatus{color:var(--accent);}
.reviewrow.miss .rvstatus{color:var(--hot);}
.reviewrow .rvsub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;}
.sheettop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
.sheetclose{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:8px 11px;font-size:13px;font-weight:800;color:var(--text);}

/* sheet (exercise detail) */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none;}
.sheet-wrap.open{display:block;}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);animation:fade .2s;}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;
  background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:10px 16px calc(28px + var(--safe-bot));animation:up .3s cubic-bezier(.2,.8,.2,1);}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:999px;background:var(--surface3);margin:6px auto 14px;}
.sheet h2{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.4px;}
.sheet .sheettop{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 78%,rgba(11,13,18,0) 100%);padding:8px 0 12px;margin:-4px 0 8px;}

/* image carousel */
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -16px;padding:0 16px;scrollbar-width:none;}
.carousel::-webkit-scrollbar{display:none;}
.slide{flex:0 0 86%;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.slide img,.slide .mapwrap{width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff;display:block;}
.slide .cap{padding:9px 12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;}
.slide .mapwrap{background:var(--surface);display:flex;align-items:center;justify-content:center;padding:6px;}
.dots{display:flex;gap:6px;justify-content:center;margin:-4px 0 12px;}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--surface3);}
.dots i.on{background:var(--accent);width:18px;border-radius:999px;}

/* steps list */
.steps{counter-reset:s;margin:8px 0 0;padding:0;list-style:none;}
.steps li{counter-increment:s;position:relative;padding:9px 0 9px 34px;border-top:1px solid var(--line);font-size:14px;color:#d7dce6;}
.steps li:first-child{border-top:none;}
.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:23px;height:23px;border-radius:7px;
  background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--accent);}

/* meta grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.mgrid div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.mgrid div .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;}
.mgrid div .v{font-size:14px;font-weight:700;margin-top:2px;text-transform:capitalize;}

/* stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1;}
.stat .v small{font-size:14px;color:var(--muted);font-weight:700;}
.stat .k{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;}
.inlineform{display:flex;gap:8px;align-items:center;}
.inlineform input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);font-size:15px;font-weight:700;text-align:center;}
.spark{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:10px;}
.spark i{flex:1;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:3px 3px 0 0;min-height:3px;opacity:.85;}

/* guide */
.guide h4{font-size:15px;margin:16px 0 6px;font-weight:800;}
.guide p,.guide li{font-size:14px;color:#d2d8e2;}
.guide ul{margin:6px 0;padding-left:20px;}
.guide .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1;min-width:130px;}
.kpi .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;}
.kpi .v{font-size:18px;font-weight:800;color:var(--accent);}

/* rest timer banner */
#restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-bot) + 12px);
  z-index:40;display:none;align-items:center;gap:12px;background:var(--surface3);border:1px solid var(--line);
  border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:220px;}
#restbar.show{display:flex;animation:up .25s;}
#restbar .rt{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2);min-width:54px;text-align:center;}
#restbar .rl{flex:1;font-size:12px;color:var(--muted);font-weight:600;}
#restbar button{font-size:13px;font-weight:800;color:var(--hot);}

/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(11,13,18,.85);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-bot);}
nav .inner{max-width:560px;margin:0 auto;display:flex;height:var(--nav-h);}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);font-size:10px;font-weight:800;letter-spacing:.2px;}
nav button .ni{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
nav button .ni svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.15;fill:none;stroke-linecap:round;stroke-linejoin:round;}
nav button.on{color:var(--accent);}

.empty{text-align:center;color:var(--muted);padding:40px 20px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.flexrow{display:flex;gap:10px;}
.flexrow > *{flex:1;}
.note{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;}
.cardio{background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(52,211,153,.05));border:1px solid rgba(34,211,238,.22);}

/* day pager (Today header) */
.app-head.daypager{gap:10px;}
.app-head.daypager .pgmid{flex:1;text-align:center;min-width:0;}
.app-head.daypager .pgmid h1{font-size:24px;margin-top:2px;}
.app-head.daypager .pgmid a{color:var(--accent);font-weight:700;}
.jumpwrap{position:relative;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;cursor:pointer;}
.jumpwrap input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer;color-scheme:dark;}
.pgbtn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:22px;font-weight:800;color:var(--text);display:flex;align-items:center;justify-content:center;}
.pgbtn[disabled]{opacity:.28;}
.pgbtn:active:not([disabled]){transform:scale(.94);}

/* workout history rows */
.histrow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;border-top:1px solid var(--line);text-align:left;}
.histrow:first-of-type{border-top:none;}
.histrow .histmain{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;}
.histrow .hd{flex:1;min-width:0;}
.histrow .hd b{font-size:14.5px;font-weight:700;}
.histrow .hr{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.histrow .hsets{font-size:12.5px;font-weight:700;color:var(--accent);}
.histrow .go{color:var(--faint);font-size:18px;flex:none;}
.histexport{flex:none;border:1px solid rgba(34,211,238,.32);background:rgba(34,211,238,.08);color:var(--accent2);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800;}
.histexport:active{transform:scale(.96);}
.exportcard{background:linear-gradient(135deg,rgba(34,211,238,.09),rgba(52,211,153,.06));border-color:rgba(34,211,238,.24);}
.exportactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.exportactions .btn{flex:1 1 145px;}
.exportactions .btn.ghost{background:rgba(255,255,255,.02);}
.exportmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.exportmeta span{font-size:11.5px;font-weight:700;color:#cfe;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:4px 8px;}

/* simplified Today extras */
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:14px 6px;line-height:1.6;}
.hint a{color:var(--accent);font-weight:700;}
.textlink{display:inline;color:var(--accent);font:inherit;font-weight:800;padding:0;text-decoration:none;}
.startline{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--faint);margin:22px 0 4px;}
.startline input{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 10px;font-size:13px;font-family:inherit;color-scheme:dark;}
.setupcard{background:linear-gradient(180deg,rgba(20,24,34,.98),rgba(13,16,23,.98));border-color:rgba(74,86,108,.64);box-shadow:0 16px 38px rgba(0,0,0,.24);padding:15px;}
.setuphead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.setuphead .tiny{font-weight:800;text-transform:uppercase;letter-spacing:.6px;}
.setupstatus{display:flex;align-items:center;gap:9px;min-width:0;font-size:12.5px;font-weight:800;color:#dce6f4;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:10px;}
.setupstatus i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(52,211,153,.12);flex:none;}
.setupstatus span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.setstart{display:block;margin-top:8px;}
.datefield{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
.datefield span{font-size:11px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);white-space:nowrap;}
.datefield input{border:0;background:transparent;padding:0;text-align:right;}
.setupactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.setupactions .btn{width:100%;}
.setupactions .setupprimary{grid-column:1/-1;font-size:15px;padding:14px;}
.dateinput,.loginput{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);font-size:15px;font-weight:800;color-scheme:dark;}
.datefield .dateinput{border:0;}
.setupnote{font-size:12px;color:var(--muted);line-height:1.45;margin-top:10px;}
.restheroicon{width:86px;height:86px;border-radius:22px;object-fit:cover;box-shadow:0 12px 32px rgba(0,0,0,.34);}
.todayhero{position:relative;overflow:hidden;background:linear-gradient(165deg,#151b25 0%,#111720 52%,#0d1118 100%);border:1px solid rgba(78,91,116,.62);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 18px 42px rgba(0,0,0,.26);}
.todayhero:before{content:"";position:absolute;right:-38px;top:-52px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 68%);pointer-events:none;}
.daynav{position:relative;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;}
.todaycenter{text-align:center;min-width:0;}
.todayeyebrow{font-size:11px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);}
.todaycenter h1{font-size:29px;line-height:1.06;margin:5px 0 3px;font-weight:900;letter-spacing:-.4px;}
.todaymeta{font-size:13px;color:var(--muted);font-weight:700;}
.todaybody{position:relative;margin-top:14px;}
.workoutstatus{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#d9e2ee;font-size:12.5px;font-weight:800;margin-bottom:9px;}
.statuspill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(52,211,153,.26);background:rgba(52,211,153,.1);color:var(--accent);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;}
.progressline{height:9px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:9px 0 12px;}
.progressline i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.heroactions{display:grid;grid-template-columns:1fr;gap:9px;}
.heroactions .btn{min-height:50px;}
.restsummary{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:12px;}
.restsummary .restheroicon{width:64px;height:64px;border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.28);}
.restsummary b{font-size:16px;}
.restsummary span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;}
.habitscard{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));}
.habittop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.habitmeter{width:54px;height:54px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;}
.habitmeter b{font-size:18px;line-height:1;color:var(--accent);}
.habitmeter span{font-size:9px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-top:3px;}
.habitlist{display:grid;grid-template-columns:1fr;gap:8px;}
.habitbtn{width:100%;display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;padding:10px;}
.habitbtn .dot{width:32px;height:32px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint);font-weight:900;}
.habitbtn b{display:block;font-size:14px;line-height:1.1;}
.habitbtn span{display:block;font-size:12px;color:var(--muted);line-height:1.25;margin-top:2px;}
.habitbtn em{font-style:normal;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);}
.habitbtn.on{border-color:rgba(52,211,153,.42);background:rgba(52,211,153,.075);}
.habitbtn.on .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.habitbtn.on em{color:var(--accent);}
.dailyweight{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;}
.dailyweight .loginput{min-height:46px;}
.dailyweight .btn{min-width:80px;}
.previewcard{padding:14px;}
.previewlist{display:flex;flex-direction:column;gap:8px;}
.previewblock{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.028);border:1px solid var(--line);border-radius:13px;padding:10px;}
.previewnum{width:34px;height:34px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent2);font-weight:900;border:1px solid var(--line);}
.previewblock.done .previewnum{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.previewblock.active{border-color:rgba(34,211,238,.34);background:rgba(34,211,238,.055);}
.previewtitle{font-size:14px;font-weight:850;line-height:1.15;}
.previewsub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.previewcount{font-size:12px;font-weight:900;color:var(--accent);white-space:nowrap;}
.quickstrip{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;font-weight:700;margin:12px 4px 2px;}
.quickstrip span{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:999px;padding:5px 9px;}
.dailygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.logmetric{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0;}
.logtap{width:100%;display:flex;align-items:center;gap:9px;text-align:left;margin-bottom:8px;}
.logtap .dot{width:24px;height:24px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint);font-weight:900;flex:none;}
.logtap.on .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.logtap b{display:block;font-size:13px;line-height:1.2;}
.logtap span{display:block;font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:2px;}
.logsave{width:100%;margin-top:8px;}
.dailygrid .wide{grid-column:1/-1;}
.chip img{width:18px;height:18px;border-radius:5px;object-fit:cover;margin-right:5px;vertical-align:-4px;}
.ride{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:4px;}
.ride:active{transform:scale(.99);}
.ride.on{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.07);}
.ride .re{font-size:22px;}
.ride .rt{flex:1;text-align:left;font-weight:700;font-size:14.5px;}
.ride.on .rt{color:var(--accent);}
.ride .rk{width:28px;height:28px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--faint);}
.ride.on .rk{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
</style>

const COMMUTE_KCAL = 600; // est. round-trip bike ride for the Stats tally

// One short cardio line per day. Riding (commute or recreational) always counts — log it on any day.
function cardioFor(phase, dayIndex){
  const base = SPLIT[dayIndex];
  if(base.key==='recovery') return { d:'Easy Zone 2 — a bike ride, walk or light row at a conversational pace, plus a few minutes of stretching.' };
  if(base.key==='rest') return { d:'Take it easy: light steps, stretch, good sleep. A casual ride is totally fine if you feel like it.' };
  let d;
  if(phase===0) d='Optional: 8–10 min easy cardio to finish.';
  else if(phase===1) d='Optional finisher: 10 min of 30 s hard / 90 s easy on a bike or rower.';
  else d='Optional: 12–18 min conditioning, or a longer ride.';
  return { d: d+' Your bike rides already count as cardio — don’t overdo it.' };
}

// Resolve a day's plan with phase adjustments applied
function planFor(week, dayIndex){
  const phase = phaseOf(week);
  const base = SPLIT[dayIndex];
  const day = { week, dayIndex, phase, key:base.key, title:base.title, focus:base.focus, type:base.type };
  day.cardio = cardioFor(phase, dayIndex);
  if(base.type==='rest'){ day.ex=[]; return day; }
  day.ex = base.ex.map((e,i)=>{
    const x = Object.assign({}, e);
    if(phase===1 && e.comp && !e.ss) x.sets = e.sets + 1;          // Build: +1 set on solo compounds
    x.superset = !!e.ss;
    return x;
  });
  return day;
}

function videoLink(id,name){ return VIDEOS[id] || ytLink(name); }
function dayProgress(plan){ const dk=dayKey(plan.week,plan.dayIndex); let tot=0,done=0; for(const e of workoutExercises(plan,dk)){ tot+=e.sets; done+=Math.min(exDoneCount(dk,e.id),e.sets);} return {done,tot,pct: tot?Math.round(done/tot*100):0}; }
function isWorkoutComplete(plan){ if(plan.type==='rest') return !!S.done[dayKey(plan.week,plan.dayIndex)]; const p=dayProgress(plan); return p.tot>0 && p.done>=p.tot; }
function workoutBlocks(plan,dk){
  if(plan.type!=='workout') return [];
  const exercises=workoutExercises(plan,dk||dayKey(plan.week,plan.dayIndex));
  const blocks=[];
  for(let i=0;i<exercises.length;){
    const first=exercises[i];
    const ex=[first];
    let j=i+1;
    if(first.ss){
      while(j<exercises.length && exercises[j].ss===first.ss){ ex.push(exercises[j]); j++; }
    }
    blocks.push({ index:blocks.length, id:first.ss||first.id, title:first.ssName||EXERCISES[first.id]?.name||'Exercise', ex });
    i=j;
  }
  return blocks;
}
function blockTotalSets(block){ return block.ex.reduce((n,e)=>n+e.sets,0); }
function blockDoneCount(block,dk){ return block.ex.reduce((n,e)=>n+Math.min(exDoneCount(dk,e.id),e.sets),0); }
function isBlockComplete(block,dk){ return blockDoneCount(block,dk)>=blockTotalSets(block); }
function firstOpenBlockIndex(plan){
  const dk=dayKey(plan.week,plan.dayIndex), blocks=workoutBlocks(plan,dk);
  const idx=blocks.findIndex(b=>!isBlockComplete(b,dk));
  return idx>=0 ? idx : 0;
}
function flowIndexFor(plan){
  const dk=dayKey(plan.week,plan.dayIndex);
  const blocks=workoutBlocks(plan,dk); if(!blocks.length) return 0;
  const saved=Number(S.flow?.[dk]);
  if(Number.isFinite(saved)) return Math.max(0,Math.min(blocks.length-1,saved));
  return firstOpenBlockIndex(plan);
}
function setFlowIndex(plan,index){
  const dk=dayKey(plan.week,plan.dayIndex);
  const blocks=workoutBlocks(plan,dk); if(!blocks.length) return;
  S.flow[dk]=Math.max(0,Math.min(blocks.length-1,index));
  save();
}
function primeWorkoutFlow(week,dayIndex){
  const plan=planFor(week,dayIndex); if(plan.type!=='workout') return;
  const dk=dayKey(week,dayIndex);
  S.flow[dk]=firstOpenBlockIndex(plan);
  save();
}
function blockLabel(block){
  if(block.ex.length===1) return 'Exercise';
  return block.ex.length===2 ? 'Superset' : 'Circuit';
}
function blockSummary(block,dk){
  const names=block.ex.map(e=>EXERCISES[e.id]?.name||e.id).join(' + ');
  return `${names} · ${blockDoneCount(block,dk)}/${blockTotalSets(block)} sets`;
}
function proteinTarget(){ const w=lastBW(); if(!w) return '≈180 g'; const lb=S.unit==='kg'?w*2.205:w; return Math.round(lb)+' g'; }
function lastBW(){ return S.bw.length? S.bw[S.bw.length-1].v : null; }
function dailyFor(dateKey){
  S.daily[dateKey]=S.daily[dateKey]||{};
  return S.daily[dateKey];
}
function prettyISO(value){ return new Date(value+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
function startStatusText(){
  const diff=Math.round((new Date(S.startDate+'T00:00')-new Date(todayISO()+'T00:00'))/86400000);
  if(diff>=0) return `Day 1 is today · ${prettyISO(todayISO())}`;
  const day=Math.min(83,Math.max(0,daysSinceStart()));
  const week=Math.floor(day/7)+1;
  return day>=83 ? `Final week · started ${prettyISO(S.startDate)}` : `Week ${week}, Day ${(day%7)+1} · started ${prettyISO(S.startDate)}`;
}

let viewingPos=null; // {week,dayIndex} when drilling into a day
let dayOffset=0;     // days away from today, for the ‹ › pager on the Today screen
function renderToday(){
  const baseNum=daysSinceStart();
  if(baseNum>83 && dayOffset===0){
    return `<div class="app-head"><div>${brandTitle('FitLab','Program complete')}</div></div>
    <div class="card center"><p class="muted">You finished all 12 weeks. Reassess your body fat, take photos, and either run it back or start a maintenance block.</p>
    <button class="btn primary" data-restart-schedule="1">Start a new 12 weeks</button></div>
    ${scheduleCard()}`;
  }
  const base=Math.max(0,baseNum);
  const num=Math.min(83,Math.max(0,base+dayOffset));
  const week=Math.floor(num/7)+1, dayIndex=num%7;
  const plan=planFor(week,dayIndex);
  const dk=dayKey(week,dayIndex);
  const prog=dayProgress(plan);
  const complete=isWorkoutComplete(plan);
  const reviewed=!!S.reviewed[dk];
  const date=dateForPos(week,dayIndex);
  const isToday=ymd(date)===todayISO();
  const relDiff=Math.round((new Date(ymd(date)+'T00:00')-new Date(todayISO()+'T00:00'))/86400000);
  const dateLabel=baseNum<0 && dayOffset===0 ? 'Starts' : (relDiff===0 ? 'Today' : (relDiff===1 ? 'Tomorrow' : (relDiff===-1 ? 'Yesterday' : '')));
  const returnLink=isToday || (baseNum<0 && dayOffset===0) ? '' : ` · <button class="textlink" data-day-today="1">${baseNum<0?'back to start':'back to today'}</button>`;
  const ctaLabel=reviewed?'Open review':(complete?'Review workout':(prog.done>0?`Continue workout`:'Start workout'));
  return `
  ${scheduleCard()}

  <div class="todayhero">
  <div class="daynav">
    <button class="pgbtn" data-day-step="-1" ${num<=0?'disabled':''} aria-label="Previous day">‹</button>
    <div class="todaycenter">
      <label class="jumpwrap todayeyebrow">${dateLabel?dateLabel+' · ':''}${fmtDate(date)}
        <input type="date" id="jumpIn" value="${ymd(date)}" min="${S.startDate}" max="${ymd(dateForPos(12,6))}">
      </label>
      <h1>${plan.title}</h1>
      <div class="todaymeta">Week ${week} · Day ${dayIndex+1} of 7${returnLink}</div>
    </div>
    <button class="pgbtn" data-day-step="1" ${num>=83?'disabled':''} aria-label="Next day">›</button>
  </div>
  <div class="todaybody">
  ${plan.type==='workout' ? `
    <div class="workoutstatus">
      <span>${prog.done}/${prog.tot} sets logged</span>
      <span class="statuspill">${complete?'Complete':(prog.done?'In progress':'Ready')}</span>
    </div>
    <div class="progressline"><i style="width:${prog.pct}%"></i></div>
    <div class="heroactions"><button class="btn primary" data-open-day="${week}.${dayIndex}">${ctaLabel}</button></div>
  ` : `
    <div class="restsummary">
      ${dayIconImg(plan.key,'restheroicon')}
      <span><b>Recovery day</b><span>${esc(plan.cardio.d)}</span></span>
    </div>`}
  </div>

  ${dailyLogCard(date,week,dayIndex,plan)}

  ${plan.type==='workout' ? workoutPreview(plan,dk) : ''}

  <div class="quickstrip">
    ${plan.type==='workout'?`<span>${esc(plan.cardio.d)}</span>`:''}
    <span>${PHASES[plan.phase].steps.toLocaleString()} steps</span>
    <span>${proteinTarget()} protein</span>

}

function exRow(e,dk){

  return `<div class="exrow ${complete?'complete':''}" data-ex="${e.id}">

function swapControl(e,dk){
  const baseId=e.originalId||e.id;
  const base=EXERCISES[baseId];
  const current=EXERCISES[e.id];
  const choices=swapChoicesFor(baseId).filter(choice=>choice.id!==e.id);
  if(!choices.length && !e.swapped) return '';
  const status=e.swapped ? `Using ${current?.name||e.id}` : 'Pick a replacement if the station is busy';
  return `<div class="swapbox">
    <div class="swaptop"><b>${esc(swapPrompt(baseId))}</b><span>${esc(status)}</span></div>
    <div class="swapbuttons">
      ${choices.map(choice=>`<button class="swapbtn" data-swap-ex="${esc(dk)}|${esc(baseId)}|${esc(choice.id)}">${esc(choice.name)}</button>`).join('')}
      ${e.swapped?`<button class="swapbtn swapclear" data-clear-swap="${esc(dk)}|${esc(baseId)}">Use ${esc(base?.name||'original')}</button>`:''}
    </div>
  </div>`;
}
function workoutPreview(plan,dk){
  const blocks=workoutBlocks(plan,dk);
  const cur=flowIndexFor(plan);
  return `<div class="card tight previewcard">
    <div class="card-h"><h3>Workout order</h3><span class="tiny faint">${blocks.length} blocks</span></div>
    <div class="previewlist">
      ${blocks.map((block,i)=>{
        const done=isBlockComplete(block,dk), active=i===cur&&!done;
        return `<div class="previewblock ${done?'done':''} ${active?'active':''}">
          <div class="previewnum">${done?'✓':i+1}</div>
          <div><div class="previewtitle">${esc(block.title)}</div><div class="previewsub">${esc(block.ex.map(e=>EXERCISES[e.id]?.name||e.id).join(' + '))}</div></div>

    <div class="blockdots">${blocks.map((block,i)=>`<i class="${isBlockComplete(block,dk)?'done':(i===cur?'on':'')}"></i>`).join('')}</div>
  </div>`;
}

function renderWorkoutFlow(plan,dk){
  const blocks=workoutBlocks(plan,dk);
  const idx=flowIndexFor(plan);
  const block=blocks[idx] || blocks[0];
  if(!block) return '';
  const done=blockDoneCount(block,dk), total=blockTotalSets(block);
  const prog=dayProgress(plan);
  const reviewed=!!S.reviewed[dk];
  const prevDisabled=idx<=0 ? 'disabled' : '';
  const atEnd=idx>=blocks.length-1;
  const nextAttrs=atEnd ? (prog.done ? 'data-finish-workout="1"' : 'disabled') : 'data-flow-step="1"';
  const nextLabel=atEnd ? (reviewed ? 'Review Again' : 'Finish & Review') : 'Save & Next';
  return `<div class="flowcard">
    <div class="flowtop">
      <div><h2>${esc(block.title)}</h2><div class="flowsub">${esc(blockSummary(block,dk))}</div></div>
      <div class="flowbadge">${blockLabel(block)} ${idx+1}/${blocks.length}</div>
    </div>
    ${block.ex.length>1?`<div class="supersettag" style="margin-bottom:8px">${blockLabel(block)}: alternate each move, then rest ${Math.max(...block.ex.map(e=>e.rest||45))}s after the round</div>`:''}

      <button class="btn primary sm" ${nextAttrs}>${nextLabel}</button>

}
function workoutEvaluationCard(plan,dk){
  let planned=0, done=0, volume=0, top=null;
  const misses=[], next=[], rows=[];
  for(const e of workoutExercises(plan,dk)){
    planned+=e.sets;
    const arr=(S.logs[dk]||{})[e.id]||[];
    const sets=arr.filter(s=>s.done);
    done+=sets.length;
    const rng=parseRange(e.reps);
    if(sets.length<e.sets) misses.push(`${EXERCISES[e.id]?.name||e.id}: ${sets.length}/${e.sets}`);
    const reps=sets.map(s=>parseInt(s.r,10)||0);
    const weights=sets.map(s=>Number(s.w)||0);
    const best=sets.reduce((m,s)=>{
      const total=totalLoadForExercise(e.id,s.w);
      return total>(m?.total||0) ? {total,entry:s.w,reps:s.r} : m;
    }, null);
    sets.forEach(s=>{
      const reps=Number(s.r)||0, total=totalLoadForExercise(e.id,s.w);
      volume+=total*reps;
      if(total>0 && (!top || total>top.total)) top={name:EXERCISES[e.id]?.name||e.id,total,entry:s.w,reps:s.r,id:e.id};
    });
    const underTarget=!rng.amrap && reps.length && reps.some(r=>r<rng.min);
    const ok=sets.length>=e.sets && !underTarget;
    const status=!sets.length?'Missed':(ok?'On plan':(sets.length<e.sets?'Short':'Under reps'));
    const actual=sets.length
      ? `${sets.length}/${e.sets} sets · reps ${reps.map(r=>r||'?').join(', ')}${best?.total?` · best ${formatSetLoad(e.id,best.entry)}`:''}`
      : 'No logged sets';
    rows.push({
      cls:ok?'ok':(!sets.length?'miss':''),
      name:EXERCISES[e.id]?.name||e.id,
      target:`Plan: ${e.sets} × ${e.reps}`,
      actual,
      status
    });
    if(!rng.amrap && sets.length>=e.sets && reps.every(r=>r>=rng.max) && weights.some(Boolean)){
      const inc=incFor(e);
      next.push(`${EXERCISES[e.id]?.name||e.id}: try ${formatSetLoad(e.id,Math.round(((weights[0]||0)+inc)*10)/10)}`);
    }else if(sets.length && underTarget && weights.some(Boolean)){
      next.push(`${EXERCISES[e.id]?.name||e.id}: hold ${formatSetLoad(e.id,weights[0])} until every set reaches ${rng.min}+ reps`);
    }else if(sets.length && sets.length<e.sets){
      next.push(`${EXERCISES[e.id]?.name||e.id}: finish all ${e.sets} planned sets before adding load`);
    }
  }
  if(!done) return '';
  const quality=done>=planned?'Complete':'Partial';
  const matchPct=planned?Math.round(done/planned*100):0;
  const topText=top?`${top.name}: ${formatSetLoad(top.id,top.entry)} x ${top.reps}`:'No loaded sets';
  return `<div class="card reviewcard">
    <div class="card-h"><h3>Workout review</h3><span class="tiny faint">${quality}</span></div>
    <div class="evalgrid">
      <div class="evalitem"><div class="v">${done}/${planned}</div><div class="k">sets done</div></div>
      <div class="evalitem"><div class="v">${Math.round(volume).toLocaleString()}</div><div class="k">est. volume</div></div>
      <div class="evalitem"><div class="v">${matchPct}%</div><div class="k">plan matched</div></div>
      <div class="evalitem"><div class="v">${misses.length}</div><div class="k">moves short</div></div>
    </div>
    <div class="evalitem" style="margin-top:8px"><b>Top set:</b> ${esc(topText)}</div>
    ${misses.length?`<div class="evalitem" style="margin-top:8px"><b>What was short:</b> ${esc(misses.slice(0,5).join(' · '))}${misses.length>5?'…':''}</div>`:''}
    <div class="reviewrows">
      ${rows.map(r=>`<div class="reviewrow ${r.cls}">
        <div class="rvtop"><b>${esc(r.name)}</b><span class="rvstatus">${esc(r.status)}</span></div>
        <div class="rvsub">${esc(r.target)}<br>${esc(r.actual)}</div>
      </div>`).join('')}
    </div>
    <div class="evalitem" style="margin-top:8px"><b>Next time:</b> ${next.length?esc(next.slice(0,3).join(' · ')):'Repeat these loads and add reps where you can.'}</div>
  </div>`;
}

// past sessions that have logged sets, newest first
function workoutHistory(){
  const out=[];
  for(const dk in S.logs){ const n=dayNum(dk); if(n<0) continue; const w=Math.floor(n/7)+1,d=n%7; const plan=planFor(w,d); if(plan.type!=='workout') continue;
    const log=S.logs[dk]; let done=0,top=null;
    for(const id in log){ if(!EXERCISES[id]) continue; log[id].forEach(s=>{ if(s.done){ done++; const wt=totalLoadForExercise(id,s.w); if(top===null||wt>top.w) top={w:wt,entry:s.w,r:s.r,name:EXERCISES[id].name,label:loadMeta(id).label}; } }); }
    if(done>0) out.push({dk,w,d,n,title:plan.title,done,top});
  }
  return out.sort((a,b)=>b.n-a.n);
}

function cleanFilePart(value){
  return String(value||'fitlab')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'') || 'fitlab';
}

function xmlEscape(value){
  return String(value??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function cdataSafe(value){
  return String(value??'').replace(/]]>/g,']]]]><![CDATA[>');

function workoutExportDetail(week,dayIndex){
  const plan=planFor(week,dayIndex);
  const dk=dayKey(week,dayIndex);
  const workoutDate=dateForPos(week,dayIndex);
  const exercises=[];
  let doneSets=0;
  let heaviest=null;

  for(const planned of workoutExercises(plan,dk)){
    const exercise=EXERCISES[planned.id];
    if(!exercise) continue;
    const logged=((S.logs[dk]||{})[planned.id]||[])
      .map((set,index)=>({
        set:index+1,
        weight:set.w===''||set.w==null?null:Number(set.w),
        totalWeight:set.w===''||set.w==null?null:totalLoadForExercise(planned.id,set.w),
        weightLabel:loadMeta(planned.id).label,
        reps:set.r===''||set.r==null?null:Number(set.r),
        done:set.done===true,
      }))
      .filter(set=>set.done);
    if(!logged.length) continue;
    doneSets+=logged.length;
    for(const set of logged){
      const weight=Number(set.totalWeight||set.weight||0);
      if(weight>0 && (!heaviest || weight>heaviest.totalWeight)){
        heaviest={ exercise:exercise.name, weight:set.weight, totalWeight:weight, weightLabel:set.weightLabel, reps:set.reps };
      }
    }
    exercises.push({
      id:planned.id,
      name:exercise.name,
      targetReps:planned.reps,
      plannedSets:planned.sets,
      restSeconds:planned.rest||60,
      primary:exercise.primary||[],
      secondary:exercise.secondary||[],
      equipment:exercise.equipment||'',
      garmin:garminExerciseFor(planned.id),
      sets:logged,
    });
  }

  const durationSeconds=estimateWorkoutSeconds(exercises);
  let start=new Date(workoutDate.getFullYear(),workoutDate.getMonth(),workoutDate.getDate(),18,0,0);
  const now=new Date();
  if(start>now) start=new Date(now.getTime()-durationSeconds*1000);
  const end=new Date(start.getTime()+durationSeconds*1000);
  const calories=Math.max(25,Math.round(durationSeconds/60*6));

  return {
    source:'FitLab',
    exportVersion:1,
    exportedAt:new Date().toISOString(),
    workout:{
      key:dk,
      week,
      dayIndex,
      dayNumber:dayIndex+1,
      title:plan.title,
      date:ymd(workoutDate),
      phase:PHASES[plan.phase].name,
      unit:S.unit,
      rideLogged:rideOn(week,dayIndex),
      cardioNote:plan.cardio?.d||'',
    },
    timing:{
      startTime:start.toISOString(),
      endTime:end.toISOString(),
      durationSeconds,
    },
    summary:{
      doneExercises:exercises.length,
      doneSets,
      durationSeconds,
      calories,
      heaviest,
    },
    exercises,
  };
}

function estimateWorkoutSeconds(exercises){
  let seconds=0;
  for(const exercise of exercises){
    const sets=exercise.sets.length;
    if(!sets) continue;
    seconds+=sets*45;
    seconds+=Math.max(0,sets-1)*(exercise.restSeconds||60);
    seconds+=45;
  }
  return Math.max(300,Math.round(seconds));
}

function workoutNotes(detail){
  const lines=[
    `FitLab ${detail.workout.title}`,
    `Week ${detail.workout.week} Day ${detail.workout.dayNumber} · ${detail.workout.date} · ${detail.workout.phase}`,
    `Logged ${detail.summary.doneSets} sets across ${detail.summary.doneExercises} exercises.`,
    `Unit: ${detail.workout.unit}`,
  ];
  if(detail.workout.rideLogged) lines.push('Bike ride was also logged in FitLab for this day.');
  lines.push('', 'Exercises:');
  for(const exercise of detail.exercises){
    lines.push(`${exercise.name} (${exercise.sets.length}/${exercise.plannedSets} sets, target ${exercise.targetReps})`);
    for(const set of exercise.sets){
      const weight=set.weight!=null && Number.isFinite(set.weight) ? formatSetLoad(exercise.id,set.weight) : 'bodyweight';
      const reps=set.reps!=null && Number.isFinite(set.reps) ? `${set.reps} reps` : 'reps not entered';
      lines.push(`  Set ${set.set}: ${weight} x ${reps}`);
    }
  }
  return lines.join('\n');
}

function tcxActivity(detail){
  const start=isoNoMs(detail.timing.startTime);
  const end=isoNoMs(detail.timing.endTime);
  const totalSeconds=Math.max(1,Math.round(detail.timing.durationSeconds));
  const notes=workoutNotes(detail);
  return `<Activity Sport="Other">
      <Id>${start}</Id>
      <Lap StartTime="${start}">
        <TotalTimeSeconds>${totalSeconds}</TotalTimeSeconds>
        <DistanceMeters>0.0</DistanceMeters>
        <Calories>${detail.summary.calories}</Calories>
        <Intensity>Active</Intensity>
        <TriggerMethod>Manual</TriggerMethod>
        <Track>
          <Trackpoint><Time>${start}</Time><DistanceMeters>0.0</DistanceMeters></Trackpoint>
          <Trackpoint><Time>${end}</Time><DistanceMeters>0.0</DistanceMeters></Trackpoint>

      </Lap>
      <Notes><![CDATA[${cdataSafe(notes)}]]></Notes>

        <LangID>en</LangID>
        <PartNumber>FITLAB-LOCAL</PartNumber>
      </Creator>
    </Activity>`;
}

function buildGarminTcx(details){

function fitTimestamp(date){
  return Math.max(0,Math.round((new Date(date).getTime()-FIT_EPOCH_MS)/1000));
}

function fitLocalTimestamp(date){
  const d=new Date(date);
  return Math.max(0,Math.round((d.getTime()-FIT_EPOCH_MS-(d.getTimezoneOffset()*60000))/1000));
}

function fitCrc(bytes,start=0,end=bytes.length){
  let crc=0;
  for(let i=start;i<end;i++){
    let tmp=FIT_CRC_TABLE[crc & 0xf];
    crc=(crc>>4)&0x0fff;
    crc=crc ^ tmp ^ FIT_CRC_TABLE[bytes[i] & 0xf];
    tmp=FIT_CRC_TABLE[crc & 0xf];
    crc=(crc>>4)&0x0fff;
    crc=crc ^ tmp ^ FIT_CRC_TABLE[(bytes[i]>>4)&0xf];
  }
  return crc & 0xffff;
}

class FitWriter{
  constructor(){ this.bytes=[]; }
  u8(v){ this.bytes.push((v??0)&0xff); }
  u16(v){ this.u8(v); this.u8((v??0)>>8); }
  u32(v){ v=Number(v??0)>>>0; this.u8(v); this.u8(v>>8); this.u8(v>>16); this.u8(v>>24); }
  str(value,size){
    const encoded=new TextEncoder().encode(String(value??''));
    const limit=Math.max(0,size-1);
    for(let i=0;i<size;i++) this.u8(i<Math.min(encoded.length,limit)?encoded[i]:0);
  }
  writeValue(field,value){
    if(field.type===FIT_TYPES.STRING){ this.str(value,field.size); return; }
    const invalid=FIT_INVALID[field.type] ?? 0xff;
    const v=Number.isFinite(Number(value)) ? Number(value) : invalid;
    if(field.type===FIT_TYPES.UINT16) this.u16(v);
    else if(field.type===FIT_TYPES.UINT32 || field.type===FIT_TYPES.UINT32Z) this.u32(v);
    else this.u8(v);
  }
  definition(localNum,globalNum,fields){
    this.u8(0x40 | localNum);
    this.u8(0);
    this.u8(0);
    this.u16(globalNum);
    this.u8(fields.length);
    fields.forEach(f=>{ this.u8(f.num); this.u8(f.size); this.u8(f.type); });
  }
  message(localNum,fields,values){
    this.u8(localNum);
    fields.forEach(f=>this.writeValue(f,values[f.key]));
  }
  close(){
    const data=new Uint8Array(this.bytes);
    const header=new Uint8Array(14);
    const hv=new DataView(header.buffer);
    header[0]=14;
    header[1]=2;
    hv.setUint16(2,FIT_PROFILE_VERSION,true);
    hv.setUint32(4,data.length,true);
    header[8]=0x2e; header[9]=0x46; header[10]=0x49; header[11]=0x54;
    hv.setUint16(12,fitCrc(header,0,12),true);
    const withoutCrc=new Uint8Array(header.length+data.length);
    withoutCrc.set(header,0);
    withoutCrc.set(data,header.length);
    const out=new Uint8Array(withoutCrc.length+2);
    out.set(withoutCrc,0);
    new DataView(out.buffer).setUint16(out.length-2,fitCrc(withoutCrc),true);
    return out;
  }
}

function fitWeightRaw(weight,unit){
  const n=Number(weight);
  if(!Number.isFinite(n) || n<=0) return null;
  const kg=unit==='kg' ? n : n/2.2046226218;
  return Math.max(0,Math.min(0xfffe,Math.round(kg*16)));
}

function fitWorkoutSets(detail){
  const rows=[];
  let cursor=new Date(detail.timing.startTime).getTime();
  for(const exercise of detail.exercises){
    for(const set of exercise.sets){
      const reps=Number(set.reps);
      const activeSeconds=Math.max(20,Math.min(90,(Number.isFinite(reps)&&reps>0?reps:8)*4+12));
      const start=new Date(cursor);
      const end=new Date(cursor+activeSeconds*1000);
      rows.push({exercise,set,start,end,durationSeconds:activeSeconds});
      cursor=end.getTime()+(exercise.restSeconds||60)*1000;
    }
  }
  return rows;
}

function fitWorkoutFilename(detail){
  return `fitlab-garmin-${detail.workout.date}-${cleanFilePart(detail.workout.title)}.fit`;
}

function buildGarminFit(detail){
  const writer=new FitWriter();
  const startFit=fitTimestamp(detail.timing.startTime);
  const endFit=fitTimestamp(detail.timing.endTime);
  const totalMs=Math.max(1000,Math.round(detail.timing.durationSeconds*1000));
  const calories=Math.max(0,Math.min(0xfffe,Math.round(detail.summary.calories||0)));
  const productName='FitLab';
  const title=`FitLab ${detail.workout.title}`;
  const defs=[
    [0,0,FIT_FIELDS.fileId],
    [1,23,FIT_FIELDS.deviceInfo],
    [2,21,FIT_FIELDS.event],
    [3,20,FIT_FIELDS.record],
    [4,264,FIT_FIELDS.exerciseTitle],
    [5,225,FIT_FIELDS.set],
    [6,19,FIT_FIELDS.lap],
    [7,18,FIT_FIELDS.session],
    [8,34,FIT_FIELDS.activity],
  ];
  defs.forEach(d=>writer.definition(d[0],d[1],d[2]));

  writer.message(0,FIT_FIELDS.fileId,{
    type:4,
    manufacturer:255,
    product:0,
    serialNumber:1234,
    timeCreated:fitTimestamp(detail.exportedAt),
  });
  writer.message(1,FIT_FIELDS.deviceInfo,{
    timestamp:startFit,
    deviceIndex:0,
    manufacturer:255,
    product:0,
    softwareVersion:100,
    productName,
  });
  writer.message(2,FIT_FIELDS.event,{ timestamp:startFit, event:0, eventType:0, data:0 });
  writer.message(3,FIT_FIELDS.record,{ timestamp:startFit, distance:0 });

  const uniqueExercises=[];
  const seen=new Set();
  for(const exercise of detail.exercises){
    const key=`${exercise.garmin.category}.${exercise.garmin.subtype}`;
    if(seen.has(key)) continue;
    seen.add(key);
    uniqueExercises.push(exercise);
  }
  uniqueExercises.forEach((exercise,index)=>writer.message(4,FIT_FIELDS.exerciseTitle,{
    messageIndex:index,
    exerciseCategory:exercise.garmin.category,
    exerciseName:exercise.garmin.subtype,
    wktStepName:exercise.garmin.label || exercise.name,
  }));

  fitWorkoutSets(detail).forEach((row,index)=>{
    const reps=Number(row.set.reps);
    writer.message(5,FIT_FIELDS.set,{
      timestamp:fitTimestamp(row.end),
      messageIndex:index,
      startTime:fitTimestamp(row.start),
      duration:Math.round(row.durationSeconds*1000),
      repetitions:Number.isFinite(reps) && reps>0 ? Math.round(reps) : null,
      weight:fitWeightRaw(row.set.totalWeight || row.set.weight,detail.workout.unit),
      setType:1,
      category:row.exercise.garmin.category,
      categorySubtype:row.exercise.garmin.subtype,
      weightDisplayUnit:detail.workout.unit==='kg'?1:2,
    });
  });

  writer.message(3,FIT_FIELDS.record,{ timestamp:endFit, distance:0 });
  writer.message(6,FIT_FIELDS.lap,{
    messageIndex:0,
    timestamp:endFit,
    event:0,
    eventType:1,
    startTime:startFit,
    totalElapsedTime:totalMs,
    totalTimerTime:totalMs,
    totalDistance:0,
    totalCalories:calories,
    sport:4,
    subSport:20,
    intensity:0,
    lapTrigger:0,
  });
  writer.message(7,FIT_FIELDS.session,{
    messageIndex:0,
    timestamp:endFit,
    event:0,
    eventType:1,
    startTime:startFit,
    sport:4,
    subSport:20,
    totalElapsedTime:totalMs,
    totalTimerTime:totalMs,
    totalDistance:0,
    totalCalories:calories,
    firstLapIndex:0,
    numLaps:1,
    trigger:1,
    sportProfileName:title,
  });
  writer.message(2,FIT_FIELDS.event,{ timestamp:endFit, event:0, eventType:1, data:0 });
  writer.message(8,FIT_FIELDS.activity,{
    timestamp:endFit,
    totalTimerTime:totalMs,
    numSessions:1,
    type:0,
    event:26,
    eventType:1,
    localTimestamp:fitLocalTimestamp(detail.timing.endTime),
  });
  return writer.close();
}

function downloadBytes(filename,bytes,mime){
  const blob=new Blob([bytes],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function downloadText(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

    <ul><li>~1 g per lb of goal bodyweight protects muscle while cutting and keeps you full.</li>
    <li>Anchor every meal with a palm-or-two of protein: eggs, chicken, beef, fish, Greek yogurt, whey.</li></ul>

    <h4>3 · Move all day, not just in the gym</h4>
    <ul><li>The commute + steps are the most underrated fat-loss tools — hit the daily goal on your Today screen.</li>
    <li>Lifting holds muscle; the commute Zone-2 adds burn without wrecking recovery.</li></ul>

    <h4>4 · Sleep & stress</h4>
    <ul><li>7–9 h sleep. Under-sleeping raises hunger hormones and tanks training quality.</li>
    <li>Manage stress — chronic cortisol makes the last few % stubborn.</li></ul>

    <h4>5 · The last mile (sub-10%)</h4>
    <ul><li>The final few percent are slow. Stay patient, keep lifting heavy, don't crash-diet.</li>
    <li>Consider a weekly refeed/higher-carb day in Phase 3 to keep training hard.</li>
    <li>Track body fat in Stats every 2 weeks — and judge with photos in consistent lighting.</li></ul>
    <div class="note">Not medical advice. If you have health conditions, check with a doctor before a calorie deficit or new training.</div>
  </div>`;
}

/* ---------- EXERCISE DETAIL SHEET ---------- */
let sheetHistoryOpen=false;
function openSheet(id){
  const x=EXERCISES[id]; if(!x) return;
  const closeLabel=view==='day'?'Back to workout':'Back';
  const slides=[
    {img:x.images[0], cap:'Start position'},
    {img:x.images[1], cap:'End position'},
    {map:true, cap:'Muscles worked'},
  ];
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="sheettop">
      <div><h2>${esc(x.name)}</h2>
      <div class="small muted">${esc(cap(x.primary.join(', ')))}${x.secondary.length?` · <span class="faint">${esc(cap(x.secondary.join(', ')))}</span>`:''}</div></div>
      <button class="sheetclose" data-close="1">${esc(closeLabel)}</button>
    </div>
    <div class="carousel" id="carousel">
      ${slides.map((s,i)=>`<div class="slide">${s.map?muscleMap(x.primary,x.secondary):`<img loading="lazy" src="${s.img}" alt="${esc(x.name)} ${s.cap}"/>`}<div class="cap"><span>${s.cap}</span><span class="faint">${i+1}/${slides.length}</span></div></div>`).join('')}
    </div>
    <div class="dots" id="dots">${slides.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>
    <a class="btn" href="${videoLink(id,x.name)}" target="_blank" rel="noopener" style="background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.4);color:#fb7185;text-decoration:none">▶ Watch video demonstration</a>
    <div class="mgrid" style="margin-top:12px">
      <div><div class="k">Equipment</div><div class="v">${esc(x.equipment||'—')}</div></div>
      <div><div class="k">Type</div><div class="v">${esc(x.mechanic||'—')}</div></div>
      <div><div class="k">Level</div><div class="v">${esc(x.level||'—')}</div></div>
      <div><div class="k">Weight</div><div class="v">${esc(loadMeta(id).label)}</div></div>
    </div>
    <h3 style="margin:18px 0 2px;font-size:15px">How to perform</h3>
    <ol class="steps">${x.instructions.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
  $('#sheetWrap').classList.add('open');
  try{
    if(sheetHistoryOpen) history.replaceState({fitlabSheet:id},'',location.href);
    else{ history.pushState({fitlabSheet:id},'',location.href); sheetHistoryOpen=true; }
  }catch(e){}
  const car=$('#carousel');
  car.onscroll=()=>{ const i=Math.round(car.scrollLeft/(car.scrollWidth/3)); $('#dots').querySelectorAll('i').forEach((d,di)=>d.classList.toggle('on',di===i)); };
}
function closeSheet(opts={}){
  const wrap=$('#sheetWrap');
  const wasOpen=wrap.classList.contains('open');
  wrap.classList.remove('open');
  if(opts.fromPop){ sheetHistoryOpen=false; return; }
  if(wasOpen && sheetHistoryOpen){
    sheetHistoryOpen=false;
    try{ history.back(); }catch(e){}
  }
}
window.addEventListener('popstate',()=>{
  if($('#sheetWrap').classList.contains('open')) closeSheet({fromPop:true});
  else sheetHistoryOpen=false;
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape' && $('#sheetWrap').classList.contains('open')) closeSheet();
});

/* ---------- rest timer ---------- */
let rtInt=null;
function startRest(sec,label){
  clearInterval(rtInt); let t=sec;
  const bar=$('#restbar'); bar.classList.add('show'); $('#rtlabel').textContent=label||'Rest';
  const tick=()=>{ $('#rtnum').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); if(t<=0){ clearInterval(rtInt); bar.classList.remove('show'); if(navigator.vibrate)navigator.vibrate([120,60,120]); } t--; };
  tick(); rtInt=setInterval(tick,1000);
}
$('#rtskip').onclick=()=>{ clearInterval(rtInt); $('#restbar').classList.remove('show'); };

/* ---------- events ---------- */
document.addEventListener('click',(e)=>{
  const t=e.target;
  const c=(s)=>t.closest(s);
  if(c('[data-close]')||t.classList.contains('sheet-bg')){ closeSheet(); return; }
  const nav=c('[data-go]'); if(nav){ go(nav.dataset.go); return; }
  const dstep=c('[data-day-step]'); if(dstep){ const base=Math.max(0,daysSinceStart()); dayOffset=Math.min(83-base,Math.max(-base,dayOffset+parseInt(dstep.dataset.dayStep,10))); render(); window.scrollTo({top:0}); return; }
  if(c('[data-day-today]')){ dayOffset=0; render(); return; }
  const back=c('[data-back]'); if(back){ go('today'); return; }
  const gfx=c('[data-garmin-fit-export]'); if(gfx){ const [w,d]=gfx.dataset.garminFitExport.split('.').map(Number); exportGarminFitWorkout(w,d); return; }
  const gx=c('[data-garmin-export]'); if(gx){ const [w,d]=gx.dataset.garminExport.split('.').map(Number); exportGarminWorkout(w,d); return; }
  const jx=c('[data-json-export]'); if(jx){ const [w,d]=jx.dataset.jsonExport.split('.').map(Number); exportWorkoutJson(w,d); return; }
  if(c('[data-garmin-fit-export-all]')){ exportAllGarminFitWorkouts(); return; }
  if(c('[data-garmin-export-all]')){ exportAllGarminWorkouts(); return; }
  if(c('[data-garmin-upload]')){ openGarminActivityImport(); return; }
  if(c('[data-json-export-all]')){ exportAllWorkoutJson(); return; }
  if(c('[data-review-jump]')){ document.querySelector('.reviewcard')?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(c('[data-finish-workout]')){
    const dk=dayKey(viewingPos.week,viewingPos.dayIndex);
    S.reviewed[dk]=true;
    save();
    render();
    requestAnimationFrame(()=>document.querySelector('.reviewcard')?.scrollIntoView({behavior:'smooth',block:'start'}));
    return;
  }
  const flow=c('[data-flow-step]'); if(flow){ const plan=planFor(viewingPos.week,viewingPos.dayIndex); setFlowIndex(plan,flowIndexFor(plan)+parseInt(flow.dataset.flowStep,10)); render(); window.scrollTo({top:0}); return; }
  const od=c('[data-open-day]'); if(od){ const [w,d]=od.dataset.openDay.split('.').map(Number); primeWorkoutFlow(w,d); viewingPos={week:w,dayIndex:d}; go('day'); return; }
  const swap=c('[data-swap-ex]'); if(swap){ const [dk,baseId,altId]=swap.dataset.swapEx.split('|'); setExerciseSwap(dk,baseId,altId); return; }
  const clearSwap=c('[data-clear-swap]'); if(clearSwap){ const [dk,baseId]=clearSwap.dataset.clearSwap.split('|'); setExerciseSwap(dk,baseId,null); return; }
  const exEl=c('[data-ex]'); if(exEl && !c('input') && !c('[data-ck]') && !c('[data-rest]')){ openSheet(exEl.dataset.ex); return; }
  const rest=c('[data-rest]'); if(rest){ const [s,n]=rest.dataset.rest.split('|'); startRest(+s,'Rest · '+n); return; }
  const adj=c('[data-adj]'); if(adj){ adjustSet(adj.dataset.adj); return; }
  const ck=c('[data-ck]'); if(ck){ toggleSet(ck.dataset.ck); return; }
  if(c('[data-restdone]')){ const dk=c('[data-restdone]').dataset.restdone; S.done[dk]=!S.done[dk]; save(); render(); return; }
  const rd=c('[data-ride]'); if(rd){ const k=rd.dataset.ride; S.rides[k]=!S.rides[k]; if(navigator.vibrate)navigator.vibrate(20); save(); render(); return; }
  const dt=c('[data-daily-toggle]'); if(dt){ toggleDaily(dt.dataset.dailyToggle); return; }
  const dbw=c('[data-log-daily-bw]'); if(dbw){ logDailyBW(dbw.dataset.logDailyBw); return; }
  if(c('[data-logbw]')){ logBW(); return; }
  if(c('[data-calcbf]')){ calcBF(); return; }
  const un=c('[data-unit]'); if(un){ S.unit=un.dataset.unit; save(); render(); return; }
  const mu=c('[data-mu]'); if(mu){ S.measUnit=mu.dataset.mu; save(); render(); return; }
  if(c('[data-start-today]')||c('[data-startday]')){ setStartDate(todayISO()); return; }
  if(c('[data-restart-schedule]')||c('[data-restart]')){ restartSchedule(); return; }
  if(c('[data-reset]')){ if(confirm('Erase all logged sets, weights and body-fat history? This cannot be undone.')){ localStorage.removeItem('fitlab_v1'); S=load(); go('today'); } return; }
});
// date pickers
document.addEventListener('change',(e)=>{
  const el=e.target;
  if(el.id==='startIn'||el.id==='startIn2'){ if(el.value){ setStartDate(el.value); } return; }
  if(el.id==='jumpIn'){ if(el.value){ const sel=new Date(el.value+'T00:00'), st=new Date(S.startDate+'T00:00'); const selNum=Math.round((sel-st)/86400000); const base=Math.max(0,daysSinceStart()); dayOffset=Math.min(83,Math.max(0,selNum))-base; render(); window.scrollTo({top:0}); } return; }
});
// set weight/reps inputs (no re-render → keeps focus)
document.addEventListener('input',(e)=>{
  const inp=e.target; if(!inp.dataset||!inp.dataset.field) return;
  const {field,ex,i}=inp.dataset; const dk=dayKey(viewingPos.week,viewingPos.dayIndex);
  const arr=S.logs[dk][ex]; arr[i][field]=inp.value;
  if(field==='w'&&inp.value) S.lastW[ex]=inp.value;
  if(field==='w') refreshLoadHint(ex);
  save();
});
function refreshLoadHint(ex){
  if(!viewingPos) return;
  const dk=dayKey(viewingPos.week,viewingPos.dayIndex);
  document.querySelectorAll('[data-load-hint]').forEach(el=>{
    if(el.dataset.loadHint===ex) el.innerHTML='<b>Load:</b> '+esc(visibleLoadHint(ex,(S.logs[dk]||{})[ex]||[]));
  });
}
function toggleSet(token){
  const [ex,i,rest]=token.split('|'); const dk=dayKey(viewingPos.week,viewingPos.dayIndex);
  const arr=S.logs[dk][ex]; const st=arr[+i]; st.done=!st.done;
  const row=document.querySelector(`[data-row="${ex}|${i}"]`); if(row) row.classList.toggle('done',st.done);
  if(st.done){ if(navigator.vibrate)navigator.vibrate(20); startRest(+rest,'Rest'); }
  // update top progress bar without full re-render
  const plan=planFor(viewingPos.week,viewingPos.dayIndex); const p=dayProgress(plan);
  const bar=document.querySelector('.bar > i'); if(bar) bar.style.width=p.pct+'%';
  const lbl=document.querySelector('.bar + .small'); if(lbl) lbl.textContent=`${p.done}/${p.tot} sets · ${p.pct}% · Phase ${plan.phase+1} ${PHASES[plan.phase].name}`;
  save();
  render();
}
// ± stepper: adjust weight/reps in place (no re-render → keeps scroll position)
function adjustSet(token){
  const [ex,i,field,deltaStr]=token.split('|'); const delta=parseFloat(deltaStr);
  const dk=dayKey(viewingPos.week,viewingPos.dayIndex);
  const st=S.logs[dk][ex][+i];
  let v=parseFloat(st[field]); if(isNaN(v)) v=0;
  v=Math.max(0, Math.round((v+delta)*100)/100);
  st[field]=v?String(v):'';
  if(field==='w'&&v) S.lastW[ex]=String(v);
  const row=document.querySelector(`[data-row="${ex}|${i}"]`);
  if(row){ const inp=row.querySelector(`input[data-field="${field}"]`); if(inp) inp.value=st[field]; }
  if(field==='w') refreshLoadHint(ex);
  if(navigator.vibrate)navigator.vibrate(8);
  save();
}
function logBW(){ const v=parseFloat($('#bwIn').value); if(!v||v<=0) return; S.bw.push({d:todayISO(),v:Math.round(v*10)/10}); save(); render(); }
function calcBF(){
  const mu=S.measUnit||'in';
  let waist=parseFloat($('#waistIn').value), neck=parseFloat($('#neckIn').value);
  if(!waist||!neck||waist<=neck){ $('#bfOut').innerHTML='<span class="small" style="color:var(--hot)">Enter waist & neck (waist must exceed neck).</span>'; return; }
  // U.S. Navy formula uses INCHES. Convert cm input to inches; height 185.4cm = 73.0in.
  if(mu==='cm'){ waist/=2.54; neck/=2.54; }
  const hIn=S.heightCm/2.54;
  const bf=86.010*Math.log10(waist-neck)-70.041*Math.log10(hIn)+36.76;
  const val=Math.max(2,Math.round(bf*10)/10);
  S.bf.push({d:todayISO(),v:val}); save();
  const tag = val<10?'You\'re already sub-10% — now it\'s about staying sharp 🔥':val<15?'Solid. Keep the deficit honest and you\'ll see abs soon.':val<20?'Good base — lock in protein + steps and it\'ll move.':'Great starting point. Trust the process — consistency wins.';
  $('#bfOut').innerHTML=`<div class="stat" style="display:inline-block;min-width:160px"><div class="v">${val}<small>%</small></div><div class="k">${tag}</div></div>`;
}

/* ---------- boot ---------- */
render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
